<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="Arial, Helvetica, sans-serif">
  <title>Рисунок 1.2 – Принцип «Трёх V»</title>
  <rect width="640" height="420" fill="#ffffff"/>
  <g fill-opacity="0.55" stroke-width="2">
    <circle cx="245" cy="160" r="125" fill="#bcd4f2" stroke="#3a6ea5"/>
    <circle cx="395" cy="160" r="125" fill="#bfe3dc" stroke="#2a8c7e"/>
    <circle cx="320" cy="280" r="125" fill="#f6dcb0" stroke="#c98a1f"/>
  </g>
  <g fill="#14305a" text-anchor="middle">
    <text x="180" y="120" font-size="22" font-weight="bold">Volume</text>
    <text x="180" y="146" font-size="16">объём</text>
    <text x="180" y="170" font-size="13" fill="#3b4a63">терабайты,</text>
    <text x="180" y="187" font-size="13" fill="#3b4a63">петабайты</text>

    <text x="462" y="120" font-size="22" font-weight="bold">Velocity</text>
    <text x="462" y="146" font-size="16">скорость</text>
    <text x="462" y="170" font-size="13" fill="#3b4a63">потоки данных,</text>
    <text x="462" y="187" font-size="13" fill="#3b4a63">реальное время</text>

    <text x="320" y="318" font-size="22" font-weight="bold">Variety</text>
    <text x="320" y="342" font-size="16">многообразие</text>
    <text x="320" y="364" font-size="13" fill="#3b4a63">структурированные и</text>
    <text x="320" y="380" font-size="13" fill="#3b4a63">неструктурированные</text>

    <text x="320" y="210" font-size="20" font-weight="bold">Big Data</text>
  </g>
</svg>
