<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Arial, Helvetica, sans-serif">
  <title>Рисунок 3.2 – Узлы кластера HDFS: Name Node и Data Node</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b4a63"/></marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <!-- client -->
  <rect x="300" y="18" width="160" height="46" rx="8" fill="#eef1f6" stroke="#3b4a63" stroke-width="1.5"/>
  <text x="380" y="47" text-anchor="middle" font-size="17" font-weight="bold" fill="#14305a">Клиент</text>
  <!-- name node -->
  <rect x="40" y="110" width="250" height="96" rx="8" fill="#bcd4f2" stroke="#3a6ea5" stroke-width="2"/>
  <text x="165" y="138" text-anchor="middle" font-size="18" font-weight="bold" fill="#14305a">Name Node</text>
  <text x="165" y="157" text-anchor="middle" font-size="13" fill="#14305a">управляющий узел</text>
  <text x="165" y="178" text-anchor="middle" font-size="12" fill="#3b4a63">пространство имён, метаданные,</text>
  <text x="165" y="194" text-anchor="middle" font-size="12" fill="#3b4a63">где лежит каждый блок файла</text>
  <!-- client <-> name node -->
  <path d="M300,48 C240,52 190,70 175,106" fill="none" stroke="#3b4a63" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="192" y="72" text-anchor="end" font-size="12" fill="#3b4a63">1. где блоки файла?</text>
  <!-- data nodes -->
  <g font-size="16" font-weight="bold" fill="#14305a" text-anchor="middle">
    <rect x="40" y="268" width="200" height="120" rx="8" fill="#d9ece8" stroke="#2a8c7e" stroke-width="2"/>
    <text x="140" y="294">Data Node 1</text>
    <rect x="280" y="268" width="200" height="120" rx="8" fill="#d9ece8" stroke="#2a8c7e" stroke-width="2"/>
    <text x="380" y="294">Data Node 2</text>
    <rect x="520" y="268" width="200" height="120" rx="8" fill="#d9ece8" stroke="#2a8c7e" stroke-width="2"/>
    <text x="620" y="294">Data Node 3</text>
  </g>
  <!-- blocks: A, B, C each replicated 3 times? default replication = 3 -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <g transform="translate(58,312)"><rect width="46" height="34" rx="4" fill="#f6dcb0" stroke="#c98a1f"/><text x="23" y="22" fill="#5a3a00">A</text></g>
    <g transform="translate(117,312)"><rect width="46" height="34" rx="4" fill="#e3d3f2" stroke="#7a52a8"/><text x="23" y="22" fill="#3c1f63">B</text></g>
    <g transform="translate(176,312)"><rect width="46" height="34" rx="4" fill="#cfe3f7" stroke="#3a6ea5"/><text x="23" y="22" fill="#14305a">C</text></g>

    <g transform="translate(298,312)"><rect width="46" height="34" rx="4" fill="#f6dcb0" stroke="#c98a1f"/><text x="23" y="22" fill="#5a3a00">A</text></g>
    <g transform="translate(357,312)"><rect width="46" height="34" rx="4" fill="#e3d3f2" stroke="#7a52a8"/><text x="23" y="22" fill="#3c1f63">B</text></g>
    <g transform="translate(416,312)"><rect width="46" height="34" rx="4" fill="#cfe3f7" stroke="#3a6ea5"/><text x="23" y="22" fill="#14305a">C</text></g>

    <g transform="translate(538,312)"><rect width="46" height="34" rx="4" fill="#f6dcb0" stroke="#c98a1f"/><text x="23" y="22" fill="#5a3a00">A</text></g>
    <g transform="translate(597,312)"><rect width="46" height="34" rx="4" fill="#e3d3f2" stroke="#7a52a8"/><text x="23" y="22" fill="#3c1f63">B</text></g>
    <g transform="translate(656,312)"><rect width="46" height="34" rx="4" fill="#cfe3f7" stroke="#3a6ea5"/><text x="23" y="22" fill="#14305a">C</text></g>
  </g>
  <text x="380" y="410" text-anchor="middle" font-size="12" fill="#3b4a63">Файл разбит на блоки A, B, C; каждый блок хранится в 3 копиях на разных узлах (репликация по умолчанию = 3)</text>
  <!-- client <-> data nodes -->
  <line x1="410" y1="64" x2="560" y2="264" stroke="#2a8c7e" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="390" y1="64" x2="390" y2="264" stroke="#2a8c7e" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="482" y="140" font-size="12" fill="#1f6b60">2. чтение и запись</text>
  <text x="482" y="156" font-size="12" fill="#1f6b60">блоков данных</text>
  <!-- data nodes -> name node: heartbeat -->
  <g stroke="#3a6ea5" stroke-width="1.3" stroke-dasharray="5 4" fill="none">
    <line x1="140" y1="266" x2="140" y2="210" marker-end="url(#a)"/>
    <path d="M330,266 C320,236 300,222 292,200" marker-end="url(#a)"/>
    <path d="M560,266 C520,230 380,214 293,182" marker-end="url(#a)"/>
  </g>
  <text x="150" y="240" font-size="12" fill="#2b5a8c">сигналы «я работаю»</text>
  <text x="150" y="255" font-size="12" fill="#2b5a8c">и отчёты о блоках</text>
</svg>
