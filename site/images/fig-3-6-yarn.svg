<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" font-family="Arial, Helvetica, sans-serif">
  <title>Рисунок 3.6 – Архитектура Hadoop MapReduce 2.0 (YARN)</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b4a63"/></marker>
  </defs>
  <rect width="780" height="420" fill="#ffffff"/>
  <!-- client -->
  <rect x="20" y="40" width="120" height="50" rx="8" fill="#eef1f6" stroke="#3b4a63" stroke-width="1.5"/>
  <text x="80" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#14305a">Клиент</text>
  <!-- resource manager -->
  <rect x="230" y="20" width="320" height="94" rx="10" fill="#bcd4f2" stroke="#3a6ea5" stroke-width="2"/>
  <text x="390" y="46" text-anchor="middle" font-size="17" font-weight="bold" fill="#14305a">Resource Manager</text>
  <text x="390" y="66" text-anchor="middle" font-size="12.5" fill="#14305a">распределяет ресурсы кластера</text>
  <rect x="250" y="76" width="130" height="28" rx="5" fill="#ffffff" stroke="#3a6ea5"/><text x="315" y="95" text-anchor="middle" font-size="12.5" fill="#14305a">Scheduler</text>
  <rect x="395" y="76" width="140" height="28" rx="5" fill="#ffffff" stroke="#3a6ea5"/><text x="465" y="95" text-anchor="middle" font-size="12.5" fill="#14305a">Applications Manager</text>
  <line x1="140" y1="65" x2="228" y2="65" stroke="#3b4a63" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="146" y="56" font-size="12" fill="#3b4a63">запуск задачи</text>
  <!-- node managers -->
  <g font-size="14" font-weight="bold" fill="#14305a" text-anchor="middle">
    <rect x="20" y="200" width="230" height="150" rx="10" fill="#d9ece8" stroke="#2a8c7e" stroke-width="2"/>
    <text x="135" y="224">Node Manager 1</text>
    <rect x="275" y="200" width="230" height="150" rx="10" fill="#d9ece8" stroke="#2a8c7e" stroke-width="2"/>
    <text x="390" y="224">Node Manager 2</text>
    <rect x="530" y="200" width="230" height="150" rx="10" fill="#d9ece8" stroke="#2a8c7e" stroke-width="2"/>
    <text x="645" y="224">Node Manager 3</text>
  </g>
  <!-- containers -->
  <g font-size="12" text-anchor="middle" fill="#14305a">
    <rect x="35" y="240" width="200" height="44" rx="6" fill="#f6dcb0" stroke="#c98a1f" stroke-width="1.5"/>
    <text x="135" y="258" font-weight="bold">Application Master</text><text x="135" y="275">(в контейнере)</text>
    <rect x="35" y="294" width="200" height="40" rx="6" fill="#ffffff" stroke="#2a8c7e"/><text x="135" y="319">Container</text>

    <rect x="290" y="240" width="95" height="94" rx="6" fill="#ffffff" stroke="#2a8c7e"/><text x="337" y="283">Container</text><text x="337" y="300" font-size="11" fill="#3b4a63">задача Map</text>
    <rect x="395" y="240" width="95" height="94" rx="6" fill="#ffffff" stroke="#2a8c7e"/><text x="442" y="283">Container</text><text x="442" y="300" font-size="11" fill="#3b4a63">задача Map</text>

    <rect x="545" y="240" width="200" height="94" rx="6" fill="#ffffff" stroke="#2a8c7e"/><text x="645" y="283">Container</text><text x="645" y="300" font-size="11" fill="#3b4a63">задача Reduce</text>
  </g>
  <!-- NM -> RM status -->
  <g stroke="#2a8c7e" stroke-width="1.3" stroke-dasharray="5 4" fill="none" marker-end="url(#a)">
    <line x1="215" y1="198" x2="300" y2="116"/>
    <line x1="420" y1="198" x2="420" y2="116"/>
    <line x1="590" y1="198" x2="520" y2="116"/>
  </g>
  <text x="430" y="160" font-size="12" fill="#1f6b60">состояние узла</text>
  <!-- AM <-> RM resource request -->
  <path d="M100,238 C90,170 170,120 245,106" fill="none" stroke="#c98a1f" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="30" y="150" font-size="12" fill="#8a5a00">запрос ресурсов</text>
  <text x="30" y="165" font-size="12" fill="#8a5a00">(контейнеров)</text>
  <!-- AM -> containers -->
  <g stroke="#c98a1f" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M235,262 C260,262 270,280 288,284"/>
    <path d="M235,270 C300,380 500,380 545,320"/>
  </g>
  <text x="300" y="378" font-size="12" fill="#8a5a00">Application Master запускает задачи в контейнерах и следит за их выполнением</text>
  <text x="20" y="408" font-size="12.5" fill="#3b4a63">Каждый узел разбит на контейнеры с определённым объёмом ресурсов; за контейнерами следит Node Manager.</text>
</svg>
