<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Arial, Helvetica, sans-serif">
  <title>Рисунок 3.3 – Два этапа работы MapReduce (на примере подсчёта слов)</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b4a63"/></marker>
  </defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <!-- column headers -->
  <g font-size="14" font-weight="bold" fill="#14305a" text-anchor="middle">
    <text x="75" y="28">Входные данные</text>
    <text x="235" y="28">Map</text>
    <text x="410" y="28">Группировка по ключу</text>
    <text x="585" y="28">Reduce</text>
    <text x="730" y="28">Результат</text>
  </g>
  <rect x="160" y="40" width="150" height="290" rx="10" fill="#bcd4f2" fill-opacity="0.35" stroke="#3a6ea5" stroke-dasharray="4 3"/>
  <rect x="510" y="40" width="150" height="290" rx="10" fill="#bfe3dc" fill-opacity="0.35" stroke="#2a8c7e" stroke-dasharray="4 3"/>
  <!-- input parts -->
  <g font-size="13" fill="#14305a" text-anchor="middle">
    <rect x="15" y="60" width="120" height="58" rx="6" fill="#eef1f6" stroke="#3b4a63"/>
    <text x="75" y="84">часть 1:</text><text x="75" y="102">«кот пёс»</text>
    <rect x="15" y="156" width="120" height="58" rx="6" fill="#eef1f6" stroke="#3b4a63"/>
    <text x="75" y="180">часть 2:</text><text x="75" y="198">«пёс кот»</text>
    <rect x="15" y="252" width="120" height="58" rx="6" fill="#eef1f6" stroke="#3b4a63"/>
    <text x="75" y="276">часть 3:</text><text x="75" y="294">«кот»</text>
  </g>
  <!-- map tasks -->
  <g font-size="13" fill="#14305a" text-anchor="middle">
    <rect x="175" y="56" width="120" height="66" rx="6" fill="#ffffff" stroke="#3a6ea5" stroke-width="1.5"/>
    <text x="235" y="80">(кот, 1)</text><text x="235" y="100">(пёс, 1)</text>
    <rect x="175" y="152" width="120" height="66" rx="6" fill="#ffffff" stroke="#3a6ea5" stroke-width="1.5"/>
    <text x="235" y="176">(пёс, 1)</text><text x="235" y="196">(кот, 1)</text>
    <rect x="175" y="248" width="120" height="66" rx="6" fill="#ffffff" stroke="#3a6ea5" stroke-width="1.5"/>
    <text x="235" y="285">(кот, 1)</text>
  </g>
  <!-- grouped -->
  <g font-size="13" fill="#14305a" text-anchor="middle">
    <rect x="345" y="92" width="130" height="50" rx="6" fill="#f6dcb0" stroke="#c98a1f"/>
    <text x="410" y="122">кот: [1, 1, 1]</text>
    <rect x="345" y="222" width="130" height="50" rx="6" fill="#e3d3f2" stroke="#7a52a8"/>
    <text x="410" y="252">пёс: [1, 1]</text>
  </g>
  <!-- reduce -->
  <g font-size="13" fill="#14305a" text-anchor="middle">
    <rect x="525" y="92" width="120" height="50" rx="6" fill="#ffffff" stroke="#2a8c7e" stroke-width="1.5"/>
    <text x="585" y="122">1+1+1 = 3</text>
    <rect x="525" y="222" width="120" height="50" rx="6" fill="#ffffff" stroke="#2a8c7e" stroke-width="1.5"/>
    <text x="585" y="252">1+1 = 2</text>
  </g>
  <!-- result -->
  <g font-size="14" font-weight="bold" fill="#14305a" text-anchor="middle">
    <rect x="690" y="140" width="85" height="80" rx="6" fill="#eef1f6" stroke="#3b4a63"/>
    <text x="732" y="174">кот: 3</text><text x="732" y="198">пёс: 2</text>
  </g>
  <!-- arrows -->
  <g stroke="#3b4a63" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <line x1="135" y1="89" x2="173" y2="89"/>
    <line x1="135" y1="185" x2="173" y2="185"/>
    <line x1="135" y1="281" x2="173" y2="281"/>
    <line x1="295" y1="80" x2="343" y2="110"/>
    <line x1="295" y1="100" x2="343" y2="236"/>
    <line x1="295" y1="176" x2="343" y2="240"/>
    <line x1="295" y1="196" x2="343" y2="124"/>
    <line x1="295" y1="281" x2="343" y2="134"/>
    <line x1="475" y1="117" x2="523" y2="117"/>
    <line x1="475" y1="247" x2="523" y2="247"/>
    <line x1="645" y1="117" x2="688" y2="165"/>
    <line x1="645" y1="247" x2="688" y2="198"/>
  </g>
  <!-- legend -->
  <g font-size="12.5" fill="#3b4a63">
    <text x="160" y="352">1. Map: главный узел делит данные на части; рабочие узлы порождают пары «ключ – значение».</text>
    <text x="160" y="372">2. Reduce: пары с одинаковым ключом сворачиваются, из ответов узлов формируется результат.</text>
  </g>
</svg>
